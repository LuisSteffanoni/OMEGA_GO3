<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fresh Prime - Asistente de Voz para Chefs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #083645, #032425, #416858, #057BC1);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: #F8F4ED;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientAnimation { 0% {background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }

        .mic {
            width: 200px; height: 200px;
            background: linear-gradient(45deg, #FF5722, #FF9800);
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 15px 40px rgba(255,87,34,0.6);
            cursor: pointer;
            transition: all 0.3s;
        }
        .mic:active { transform: scale(0.9); background: #f44336; }
        .transcript { background: rgba(255,255,255,0.1); padding: 18px; border-radius: 12px; min-height: 90px; margin: 15px 0; font-size: 17px; }
        .order-item { padding: 12px; background: rgba(0,0,0,0.3); margin: 8px 0; border-radius: 10px; }
        button { padding: 14px 24px; margin: 8px; border-radius: 12px; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>

    <div style="text-align:center;">
        <img src="https://i.imgur.com/EZ5QUew.png" style="width:130px; border-radius:50%; margin-bottom:10px;">
        <h1>Fresh Prime</h1>
        <p style="font-size:19px; margin:10px 0;">Asistente de Voz para Chefs</p>
        <p style="opacity:0.8;">Habla como siempre, yo lo traduzco</p>
    </div>

    <div onclick="toggleListening()" id="mic" class="mic">🎤</div>
    <div id="status" style="text-align:center; font-size:16px; min-height:28px;"></div>

    <div class="transcript" id="transcript">Presiona el micrófono y habla normalmente...</div>

    <h2 style="text-align:center; margin:20px 0 10px;">Orden Generada</h2>
    <div id="order-list" style="max-height:420px; overflow-y:auto;"></div>

    <div style="text-align:center; margin-top:25px;">
        <button onclick="sendToWhatsApp()" style="background:#25D366; color:white;">📱 Enviar WhatsApp</button>
        <button onclick="downloadCSV()" style="background:#2196F3; color:white;">📊 Descargar CSV / Excel</button>
        <button onclick="clearAll()" style="background:#f44336; color:white;">🗑️ Limpiar</button>
    </div>

    <script>
        let isListening = false;
        let recognition = null;
        let currentOrder = [];

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("❌ Tu navegador no soporta voz.\nAbre esta página en Chrome (mejor resultado).");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = "es-MX";
            recognition.continuous = true;           // ← Mejorado
            recognition.interimResults = true;       // ← Muestra mientras habla

            recognition.onresult = (event) => {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById("transcript").textContent = transcript;
                
                if (event.results[event.results.length-1].isFinal) {
                    parseNaturalOrder(transcript);
                }
            };

            recognition.onend = () => { isListening = false; document.getElementById("mic").style.background = "linear-gradient(45deg, #FF5722, #FF9800)"; };
            recognition.start();
            isListening = true;
            document.getElementById("mic").style.background = "#f44336";
            document.getElementById("status").innerHTML = "🎤 Escuchando... habla normal (puedes decir varias cosas seguidas)";
        }

        function stopListening() {
            if (recognition) recognition.stop();
        }

        function parseNaturalOrder(text) {
            const lower = text.toLowerCase();
            const parts = lower.split(/,| y | luego | después | más | otro /);

            parts.forEach(part => {
                if (!part.trim()) return;

                const qtyMatch = part.match(/(\d+(?:\.\d+)?)/);
                let qty = qtyMatch ? parseFloat(qtyMatch[1]) : 1;

                let product = part.replace(/(\d+(?:\.\d+)?)\s*(kilo|kg|pieza|litro|caja|paquete|gramo)?/i, '').trim();
                let notes = "";

                if (lower.includes("decoracion") || lower.includes("decoración") || lower.includes("para decorar")) notes = "Decoración";
                if (lower.includes("primera") || lower.includes("bueno") || lower.includes("calidad")) notes = (notes ? notes + " - " : "") + "Calidad Primera";

                if (product.length > 2) {
                    currentOrder.push({
                        product: product.charAt(0).toUpperCase() + product.slice(1),
                        quantity: qty,
                        unit: "Kilo",
                        notes: notes
                    });
                }
            });

            renderOrder();
        }

        function renderOrder() {
            const container = document.getElementById("order-list");
            container.innerHTML = "";
            currentOrder.forEach((item, i) => {
                const div = document.createElement("div");
                div.className = "order-item";
                div.innerHTML = `
                    <div><strong>${item.quantity} ${item.unit}</strong> ${item.product}</div>
                    <div style="text-align:right;">
                        ${item.notes ? `<small>${item.notes}</small><br>` : ''}
                        <button onclick="editItem(${i})" style="font-size:12px;padding:4px 8px;">Editar</button>
                        <button onclick="removeItem(${i})" style="font-size:12px;padding:4px 8px;background:#f44336;color:white;">Quitar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editItem(i) {
            const item = currentOrder[i];
            let newQty = prompt("Cantidad:", item.quantity);
            if (newQty !== null) item.quantity = parseFloat(newQty) || item.quantity;
            let newProd = prompt("Producto:", item.product);
            if (newProd) item.product = newProd;
            renderOrder();
        }

        function removeItem(i) {
            currentOrder.splice(i, 1);
            renderOrder();
        }

        function clearAll() {
            if (confirm("¿Borrar toda la orden?")) {
                currentOrder = [];
                document.getElementById("order-list").innerHTML = "";
                document.getElementById("transcript").textContent = "Orden borrada";
            }
        }

        function sendToWhatsApp() {
            if (currentOrder.length === 0) return alert("No hay nada para enviar");
            const name = prompt("Nombre del restaurante / chef:", "");
            let msg = `📋 *Orden por Voz - Fresh Prime*\n👤 ${name || "Chef"}\n\n`;
            currentOrder.forEach(item => {
                msg += `• ${item.quantity} ${item.unit} ${item.product} ${item.notes ? `(${item.notes})` : ''}\n`;
            });
            window.open(`https://wa.me/524424225756?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function downloadCSV() {
            if (currentOrder.length === 0) return alert("No hay orden");
            let csv = "Cantidad,Unidad,Producto,Notas\n";
            currentOrder.forEach(i => {
                csv += `${i.quantity},${i.unit},"${i.product}","${i.notes}"\n`;
            });
            const blob = new Blob([csv], {type: "text/csv"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Orden_FreshPrime_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }
    </script>
</body>
</html>
