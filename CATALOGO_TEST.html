<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fresh Prime - Asistente de Voz para Chefs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #083645, #032425, #416858, #057BC1);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: #F8F4ED;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientAnimation { 0% {background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { width: 140px; border-radius: 50%; }
        .mic-button {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #FF5722, #FF9800);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(255, 87, 34, 0.5);
            animation: pulse 2s infinite;
        }
        .transcript {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            min-height: 80px;
            margin: 20px 0;
            font-size: 17px;
        }
        .order-list {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        button { padding: 12px 20px; margin: 8px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .send-btn { background: #25D366; color: white; }
        .clear-btn { background: #f44336; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.imgur.com/EZ5QUew.png" class="logo" alt="Fresh Prime">
        <h1>Fresh Prime</h1>
        <p style="font-size:18px;">Asistente de Voz para Chefs</p>
        <p style="font-size:14px; opacity:0.8;">Habla normal… yo lo traduzco y lo ordeno</p>
    </div>

    <div onclick="startVoiceRecognition()" class="mic-button">🎤</div>

    <div id="status" style="text-align:center; font-size:15px; margin:10px 0; min-height:24px;"></div>

    <div class="transcript" id="transcript">Aquí aparecerá lo que dijiste...</div>

    <h2 style="margin:20px 0 10px; text-align:center;">Orden generada:</h2>
    <div class="order-list" id="order-list"></div>

    <div style="text-align:center; margin-top:25px;">
        <button onclick="sendToWhatsApp()" class="send-btn">📱 Enviar por WhatsApp</button>
        <button onclick="downloadExcel()" class="send-btn" style="background:#2196F3;">📊 Descargar Excel</button>
        <button onclick="clearOrder()" class="clear-btn">🗑️ Limpiar todo</button>
    </div>

    <script>
        let currentOrder = [];

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta voz. Abre con Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "es-MX";
            recognition.interimResults = false;

            document.getElementById("status").innerHTML = "🎤 Escuchando... habla normal";

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById("transcript").textContent = text;
                parseAndShowOrder(text);
            };

            recognition.onerror = () => document.getElementById("status").innerHTML = "❌ No entendí bien. Intenta de nuevo";
            recognition.start();
        }

        function parseAndShowOrder(text) {
            currentOrder = [];
            const parts = text.toLowerCase().split(/,| y | luego | después /);

            parts.forEach(part => {
                part = part.trim();
                if (!part) return;

                const qtyMatch = part.match(/(\d+(?:\.\d+)?)/);
                const qty = qtyMatch ? parseFloat(qtyMatch[1]) : 1;

                let product = part.replace(/(\d+(?:\.\d+)?)\s*(kilo|kg|pieza|litro|caja|paquete)?/i, '').trim();
                let notes = "";

                if (part.includes("decoracion") || part.includes("decoración") || part.includes("para decorar")) notes = "Decoración";
                if (part.includes("primera") || part.includes("bueno")) notes = (notes ? notes + " - " : "") + "Calidad primera";

                currentOrder.push({ product: product.charAt(0).toUpperCase() + product.slice(1), quantity: qty, unit: "Kilo", notes: notes });
            });

            renderOrder();
        }

        function renderOrder() {
            const container = document.getElementById("order-list");
            container.innerHTML = "";

            currentOrder.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "order-item";
                div.innerHTML = `
                    <div>
                        <strong>${item.quantity} ${item.unit}</strong> ${item.product}<br>
                        <small style="opacity:0.7">${item.notes || ''}</small>
                    </div>
                    <div>
                        <button onclick="editItem(${index})" style="font-size:12px; padding:4px 8px;">Editar</button>
                        <button onclick="removeItem(${index})" style="font-size:12px; padding:4px 8px; background:#f44336; color:white;">Eliminar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editItem(index) {
            const item = currentOrder[index];
            const newQty = prompt("Cantidad:", item.quantity);
            if (newQty) item.quantity = parseFloat(newQty);
            const newProduct = prompt("Producto:", item.product);
            if (newProduct) item.product = newProduct;
            renderOrder();
        }

        function removeItem(index) {
            currentOrder.splice(index, 1);
            renderOrder();
        }

        function clearOrder() {
            if (confirm("¿Borrar toda la orden?")) {
                currentOrder = [];
                document.getElementById("order-list").innerHTML = "";
                document.getElementById("transcript").textContent = "Orden limpiada";
            }
        }

        function sendToWhatsApp() {
            if (currentOrder.length === 0) return alert("No hay orden para enviar");
            const client = prompt("Nombre del cliente / restaurante:", "");
            let msg = `📋 *Orden Fresh Prime - Voz*\n👤 ${client || 'Chef'}\n\n`;
            currentOrder.forEach(item => {
                msg += `• ${item.quantity} ${item.unit} ${item.product} ${item.notes ? `(${item.notes})` : ''}\n`;
            });
            window.open(`https://wa.me/524424225756?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function downloadExcel() {
            if (currentOrder.length === 0) return alert("No hay orden");
            let csv = "Producto,Cantidad,Unidad,Notas\n";
            currentOrder.forEach(item => {
                csv += `"${item.product}",${item.quantity},"${item.unit}","${item.notes}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Orden_Voz_FreshPrime.csv";
            a.click();
        }
    </script>
</body>
</html>
