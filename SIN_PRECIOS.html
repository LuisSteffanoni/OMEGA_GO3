<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fresh Prime - Orden de Compra OPERACIÓN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #083645, #032425, #416858, #057BC1);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: #F8F4ED;
            min-height: 100vh;
            padding: 15px;
        }
        @keyframes gradientAnimation { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        .cover-page, .container { 
            background: linear-gradient(135deg, rgba(9,51,44,0.35), rgba(65,104,88,0.4)); 
            backdrop-filter: blur(12px); 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(244,237,228,0.25); 
        }
        .cover-page { padding: 25px; margin-bottom: 20px; text-align:center; }
        .logo { max-width: 170px; }

        .product-table { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 14px; 
        }
        .product-card { 
            background: rgba(3,36,37,0.6); 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid rgba(140,186,127,0.3); 
            transition: all 0.2s;
        }
        .product-card:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

        h3 { font-size: 15.5px; margin-bottom: 10px; }
        p { font-size: 13px; color: #E5EAE6; margin-bottom: 10px; }

        .quantity-input, .unit-select {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            background: #032425;
            color: #F8F4ED;
            border: 1px solid #8CBA7F;
            border-radius: 8px;
            font-size: 15px;
        }
        .unit-select option { background: #032425; color: #F8F4ED; }

        .notes-btn {
            padding: 10px;
            width: 100%;
            background: linear-gradient(45deg, #8CBA7F, #00664D);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        .notes-input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            display: none;
            background: #032425;
            color: #F8F4ED;
            border: 1px solid #8CBA7F;
            border-radius: 8px;
        }

        .buttons button {
            padding: 14px 20px;
            margin: 8px;
            background: linear-gradient(45deg, #8CBA7F, #00664D);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
        }

        @media (max-width: 480px) {
            .product-table { grid-template-columns: 1fr; }
            .product-card { padding: 14px; }
        }
    </style>
</head>
<body>

    <!-- Cover -->
    <div class="cover-page">
        <img class="logo" src="https://i.imgur.com/EZ5QUew.png" alt="Fresh Prime">
        <h1>ORDEN DE COMPRA - OPERACIÓN</h1>
        <p>Para Chefs y Cocina • Solo Cantidades</p>
        <p id="dynamic-timestamp"></p>
    </div>

    <div class="container" style="padding:20px;">
        
        <!-- Agregar Producto -->
        <div style="margin:15px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px;">
            <h3>➕ Agregar Producto Nuevo</h3>
            <input type="text" id="new-name" placeholder="Nombre del producto" style="width:58%;">
            <select id="new-category" style="width:38%;">
                <option value="Abarrotes">Abarrotes</option>
                <option value="Proteinas">Proteínas</option>
                <option value="Frutas y Verduras">Frutas y Verduras</option>
                <option value="Lacteos">Lácteos</option>
                <option value="Chiles, semillas y especias">Chiles y Especias</option>
                <option value="Otros">Otros</option>
            </select>
            <button onclick="addNewProduct()" style="width:100%; margin-top:8px;">Agregar a la Lista</button>
        </div>

        <!-- Filtros -->
        <div style="text-align:center; margin:15px 0;">
            <input type="text" id="search-bar" placeholder="🔎 Buscar producto..." style="width:65%; padding:12px;">
            <select id="class-filter" style="padding:12px; width:30%;">
                <option value="all">Todos</option>
                <option value="Abarrotes">Abarrotes</option>
                <option value="Proteinas">Proteínas</option>
                <option value="Frutas y Verduras">Frutas y Verduras</option>
                <option value="Lacteos">Lácteos</option>
                <option value="Chiles, semillas y especias">Chiles y Especias</option>
                <option value="Otros">Otros</option>
            </select>
        </div>

        <div class="product-table" id="product-list"></div>

        <!-- Resumen -->
        <div style="margin-top:30px; padding:15px; background:rgba(3,36,37,0.4); border-radius:15px;">
            <h2>Resumen de Orden</h2>
            <table id="resumen-table" style="width:100%; border-collapse:collapse; margin-top:10px;">
                <thead><tr><th>Producto</th><th>Cantidad</th><th>Unidad</th><th>Notas</th></tr></thead>
                <tbody id="resumen-tbody"></tbody>
            </table>
        </div>

        <div style="text-align:center; margin-top:25px;">
            <button onclick="downloadExcel()">📊 Descargar Excel</button>
            <button onclick="sendToWhatsApp()">📱 Enviar WhatsApp</button>
        </div>
    </div>

        function renderProducts(filtered) {
            const container = document.getElementById("product-list");
            container.innerHTML = "";
            filtered.forEach(p => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.setAttribute("data-category", p.category);   // ← CORREGIDO
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <p><strong>Categoría:</strong> ${p.category}</p>
                    <input type="number" class="quantity-input" step="0.01" min="0" value="0" onchange="updateResumen()">
                    <select class="unit-select" onchange="updateResumen()">
                        <option value="Kilo">Kilo</option>
                        <option value="Pieza">Pieza</option>
                        <option value="Caja">Caja</option>
                        <option value="Litro">Litro</option>
                        <option value="Paquete">Paquete</option>
                    </select>
                    <button class="notes-btn" onclick="toggleNotes(this)">Agregar Nota</button>
                    <input type="text" class="notes-input" placeholder="Notas..." onkeyup="updateResumen()">
                `;
                container.appendChild(card);
            });
        }

        function addNewProduct() {
            const name = document.getElementById("new-name").value.trim();
            const category = document.getElementById("new-category").value;
            if (name) {
                products.unshift({name: name.toUpperCase(), category: category});
                renderProducts(products);
                document.getElementById("new-name").value = "";
                alert("✅ Producto agregado");
            }
        }

        function toggleNotes(btn) {
            const input = btn.nextElementSibling;
            input.style.display = input.style.display === "block" ? "none" : "block";
            updateResumen();
        }

        function updateResumen() {
            const tbody = document.getElementById("resumen-tbody");
            tbody.innerHTML = "";
            document.querySelectorAll(".product-card").forEach(card => {
                const qty = parseFloat(card.querySelector(".quantity-input").value) || 0;
                if (qty > 0) {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${card.querySelector("h3").textContent}</td>
                        <td>${qty}</td>
                        <td>${card.querySelector(".unit-select").value}</td>
                        <td>${card.querySelector(".notes-input").value || 'Sin notas'}</td>
                    `;
                }
            });
        }

        function filterProducts() {
            const search = document.getElementById("search-bar").value.toLowerCase().trim();
            const category = document.getElementById("class-filter").value;

            const filtered = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search);
                const matchCategory = (category === "all" || p.category === category);
                return matchSearch && matchCategory;
            });

            renderProducts(filtered);
        }

        function downloadExcel() {
            let csv = "Producto,Cantidad,Unidad,Notas\n";
            document.querySelectorAll(".product-card").forEach(card => {
                const qty = parseFloat(card.querySelector(".quantity-input").value) || 0;
                if (qty > 0) {
                    csv += `"${card.querySelector("h3").textContent}",${qty},"${card.querySelector(".unit-select").value}","${card.querySelector(".notes-input").value || ''}"\n`;
                }
            });
            const blob = new Blob([csv], { type: "text/csv" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Orden_Operacion_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function sendToWhatsApp() {
            let name = prompt("Nombre del Chef / Responsable:");
            if (!name) return;
            let msg = `📋 *Orden de Compra - OPERACIÓN Fresh Prime*\n👤 *Responsable:* ${name}\n📅 ${document.getElementById("dynamic-timestamp").textContent}\n\n`;
            document.querySelectorAll(".product-card").forEach(card => {
                const qty = parseFloat(card.querySelector(".quantity-input").value) || 0;
                if (qty > 0) {
                    msg += `• ${card.querySelector("h3").textContent} → ${qty} ${card.querySelector(".unit-select").value}\n`;
                    const note = card.querySelector(".notes-input").value;
                    if (note) msg += `   Nota: ${note}\n`;
                }
            });
            window.open(`https://wa.me/524424225756?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = function() {
            document.getElementById("dynamic-timestamp").textContent = new Date().toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});
            renderProducts(products);

            // FILTROS CORREGIDOS
            document.getElementById("search-bar").addEventListener("input", filterProducts);
            document.getElementById("class-filter").addEventListener("change", filterProducts);
        };
    </script>
